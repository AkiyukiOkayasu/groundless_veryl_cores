name: Deploy Docs to Pages

on:
    push:
        branches: ['main']
        paths:
            - 'src/**/*.veryl'
            - 'Veryl.toml'
            - 'Veryl.lock'
            - 'packages/**/*.veryl'
            - 'packages/**/Veryl.toml'
            - 'packages/**/README.md'
            - 'packages/**/Veryl.lock'
            - 'dependencies/**/*.veryl'
            - '.github/workflows/pages.yml'

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v6
            - uses: veryl-lang/setup-veryl@v1
              with:
                  version: nightly
            - name: Generate documentation
              run: veryl doc
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: doc
            - id: deployment
              uses: actions/deploy-pages@v5
